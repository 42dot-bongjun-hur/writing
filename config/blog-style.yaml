blog:
  format: short_observation_essay
  paragraphs_min: 3
  paragraphs_max: 8
  numbered_paragraphs: true

writing:
  sentence_style: short_plain
  flow:
    - scene
    - observation
    - change
    - meaning
  avoid:
    - lecture_tone
    - motivational_slogans
    - excessive_adjectives
    - repeated_summary

illustration:
  house_style: note_cartoon
  reference_mode: broad_visual_language_only
  line:
    color: near_black
    weight: medium_hand_drawn
    regularity: slightly_wobbly
  background:
    preferred:
      - white
      - very_light_gray
      - pale_blue_gray
    avoid_default:
      - warm_ivory_paper
      - beige_horizon_scene
  spot_color:
    max_count: 1
    families:
      - muted_blue
      - brick_orange
      - olive_green
      - mustard_yellow
      - muted_plum
  composition:
    subject_area_percent: 25-55
    center_is_default: false
    vary_between_posts: true
  text_in_image: false
  forbid:
    - exact_artist_replication
    - exact_reference_composition
    - cute_sd_character
    - webtoon_panels
    - photorealism
    - 3d_render
    - dramatic_lighting
